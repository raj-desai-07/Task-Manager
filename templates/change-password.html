<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Change Password</title>
{% load static %}
<link rel="icon" type="image/x-icon" href="{% static 'img/logo.png' %}">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/change-password.css' %}">
</head>
<body>

  {% if not request.session.user %}
    <script>
        window.location.replace("/login/");
    </script>
  {% endif %}

<div class="password-layout">

  <div class="illustration">
    <div class="circle big"></div>
    <div class="circle small"></div>
    <i class="fa-solid fa-lock lock-icon"></i>
  </div>

  <div class="password-card">
    <img src="img/logo.png" class="logo">

    <h1>Change Password</h1>
    <p class="subtitle">Choose a strong password to keep your account secure.</p>

    <div class="form-group">
      <label>Current Password</label>
      <div class="input-box">
        <input type="password" id="currentPassword">
        <i class="fa-solid fa-eye" onclick="toggle(this)"></i>
      </div>
    </div>

    <div class="form-group">
      <label>New Password</label>
      <div class="input-box">
        <input type="password" id="newPassword">
        <i class="fa-solid fa-eye" onclick="toggle(this)"></i>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="input-box">
        <input type="password" id="confirmPassword">
        <i class="fa-solid fa-eye" onclick="toggle(this)"></i>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn cancel" style="text-decoration: none;">Cancel</a>
      <button class="btn primary" onclick="openConfirm()">Change Password</button>
    </div>
  </div>

</div>

<!-- CONFIRMATION MODAL -->
<div class="custom-modal" id="confirmModal">
  <div class="modal-box">
    <h3>Confirm Password Change</h3>
    <p>Your password will be updated immediately.</p>

    <div class="modal-actions">
      <button class="btn cancel" onclick="closeConfirm()">Go Back</button>
      <button class="btn primary" onclick="finalChange()">Confirm</button>
    </div>
  </div>
</div>

<script>
function toggle(icon){
  const input = icon.previousElementSibling
  input.type = input.type === "password" ? "text" : "password"
  icon.classList.toggle("fa-eye-slash")
}

function openConfirm(){
  const newPass = document.getElementById('newPassword').value
  const confirmPass = document.getElementById('confirmPassword').value

  if(!newPass || !confirmPass){
    alert("Please fill all fields")
    return
  }

  if(newPass !== confirmPass){
    alert("Passwords do not match")
    return
  }

  document.getElementById('confirmModal').classList.add('show')
}

function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('show')
}

function finalChange(){
  alert("Password changed successfully")
}
</script>

</body>
</html>
